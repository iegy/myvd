name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (core engine)
        run: python -W ignore -m unittest discover -s tests -v

  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch yt-dlp and ffmpeg
        shell: bash
        run: |
          set -e
          mkdir -p bin/mpv tmp
          curl -L --fail --retry 3 -o bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -L --fail --retry 3 -o tmp/ffmpeg.zip https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
          7z e tmp/ffmpeg.zip ffmpeg.exe -r -obin -y
          ls -la bin
          ./bin/yt-dlp.exe --version

      - name: Fetch mpv (optional, for ad-free preview)
        continue-on-error: true
        shell: bash
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern "mpv-x86_64-[0-9]*.7z" --dir tmp
          7z x tmp/mpv-x86_64-*.7z -obin/mpv -y
          ls bin/mpv

      - name: Add Vulkan loader for mpv (vulkan-1.dll)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          mkdir -p bin/mpv
          curl -L --fail --retry 3 -o tmp/vulkan.zip https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip
          7z x tmp/vulkan.zip -otmp/vulkan -y
          DLL=$(find tmp/vulkan -ipath '*x64*' -name 'vulkan-1.dll' | head -1)
          echo "found: $DLL"
          cp "$DLL" bin/mpv/vulkan-1.dll
          ls -la bin/mpv

      - name: Build portable app
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name MYVD --icon assets/icon.ico --add-data "assets;assets" --paths src src/main.py
          mkdir -p dist/MYVD/bin
          cp -r bin/. dist/MYVD/bin/
          cp README.md dist/MYVD/

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MYVD\MYVD.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "dist\MYVD\selftest.txt") { Get-Content "dist\MYVD\selftest.txt" } else { Write-Host "no selftest.txt was written" }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }
          Remove-Item "dist\MYVD\selftest.txt", "dist\MYVD\data" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path dist\MYVD -DestinationPath MYVD-Windows-Portable.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: MYVD-Windows-Portable
          path: MYVD-Windows-Portable.zip

      - name: Publish release (fixed tag "latest")
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MYVD-Windows-Portable.zip \
            --title "MYVD for Windows (Portable) - latest" \
            --notes "Unzip the folder anywhere and run MYVD.exe. No installation needed. Android version: https://github.com/iegy/YTD/releases/tag/latest"
